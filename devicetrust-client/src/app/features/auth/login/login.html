<section class="auth-split">
  <div class="auth-form-panel">
    <div class="auth-form-inner">
      <h1>Sign in</h1>
      <p class="auth-sub">Manage your devices and their repair history.</p>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <label>
          Email
          <input type="email" formControlName="email" autocomplete="email" placeholder="you@example.com" />
        </label>
        @if (form.get('email')?.touched && form.get('email')?.invalid) {
          <p class="field-error">Enter a valid email address.</p>
        }

        <label>
          Password
          <input type="password" formControlName="password" autocomplete="current-password" />
        </label>

        @if (errorMessage()) {
          <p class="form-error">{{ errorMessage() }}</p>
        }

        <button type="submit" [disabled]="form.invalid || isSubmitting()">
          {{ isSubmitting() ? 'Signing in…' : 'Sign in' }}
        </button>
      </form>

      <p class="auth-switch">New here? <a routerLink="/register">Create an account</a></p>
    </div>
  </div>

  <div class="auth-visual-panel">
    <app-trust-illustration caption="Every repair, permanently on the record." />
  </div>
</section>
