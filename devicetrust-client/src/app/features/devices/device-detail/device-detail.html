<div class="transfer-section">
  @if (transferSuccess()) {
    <p class="success-message">{{ transferSuccess() }}</p>
  } @else if (!showTransferForm()) {
    <button (click)="showTransferForm.set(true)">Transfer Ownership</button>
  } @else {
    <form [formGroup]="transferForm" (ngSubmit)="onStartTransfer()">
      <label>
        Buyer's Email
        <input type="email" formControlName="buyerEmail" placeholder="buyer@example.com" />
      </label>
      <p class="hint">The buyer must already have a DeviceTrust account.</p>

      @if (transferError()) {
        <p class="form-error">{{ transferError() }}</p>
      }

      <div class="form-actions">
        <button type="button" (click)="showTransferForm.set(false)">Cancel</button>
        <button type="submit" [disabled]="transferForm.invalid || transferSubmitting()">
          {{ transferSubmitting() ? 'Sending...' : 'Send Transfer Request' }}
        </button>
      </div>
    </form>
  }
</div>
