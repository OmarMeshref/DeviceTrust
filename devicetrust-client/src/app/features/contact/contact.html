<section class="content-split">
  <div class="content-copy">
    <span class="page-eyebrow">Contact</span>
    <h1>Questions about DeviceTrust?</h1>
    <p class="static-lede">Send a message and it'll reach the project directly.</p>

    @if (submitted()) {
      <p class="success-message">Thanks — your message has been noted.</p>
    } @else {
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <label>
          Name
          <input type="text" formControlName="name" />
        </label>
        <label>
          Email
          <input type="email" formControlName="email" />
        </label>
        <label>
          Message
          <textarea formControlName="message" rows="5"></textarea>
        </label>
        <button type="submit" [disabled]="form.invalid">Send message</button>
      </form>
    }
  </div>

  <div class="content-visual">
    <svg viewBox="0 0 300 260" class="contact-illus" role="img" aria-label="A message being sent">
      <g class="c-frame" stroke="#12958A" stroke-width="2" fill="none" stroke-linecap="round">
        <path d="M20 46 V28 a6 6 0 0 1 6-6 h18" />
        <path d="M280 46 V28 a6 6 0 0 0-6-6 h-18" />
        <path d="M20 214 v18 a6 6 0 0 0 6 6 h18" />
        <path d="M280 214 v18 a6 6 0 0 1-6 6 h-18" />
      </g>
      <rect class="c-card" x="50" y="60" width="200" height="140" rx="12" fill="#0F172A" />
      <path class="c-env" d="M66 84 h168 v92 h-168 z" fill="none" stroke="#334155" stroke-width="2" />
      <path class="c-env-flap" d="M66 84 l84 60 l84 -60" fill="none" stroke="#12958A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
      <g class="c-lines" stroke="#334155" stroke-width="6" stroke-linecap="round">
        <line x1="90" y1="176" x2="170" y2="176" />
        <line x1="90" y1="160" x2="200" y2="160" />
      </g>
    </svg>
    <p class="illus-caption">Sent messages reach the project directly — no ticket system, no queue.</p>
  </div>
</section>
