<div class="page">
  <h1>Register a Device</h1>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <label>
      Device Type
      <select formControlName="type">
        @for (t of deviceTypes; track t.value) {
          <option [value]="t.value">{{ t.label }}</option>
        }
      </select>
    </label>

    <label>
      Brand
      <input type="text" formControlName="brand" placeholder="e.g. Lenovo" />
    </label>

    <label>
      Model
      <input type="text" formControlName="model" placeholder="e.g. Legion 5" />
    </label>

    <label>
      Serial Number
      <input type="text" formControlName="serialNumber" />
    </label>

    <label>
      Purchase Date (optional)
      <input type="date" formControlName="purchaseDate" />
    </label>

    @if (errorMessage()) {
      <p class="form-error">{{ errorMessage() }}</p>
    }

    <div class="form-actions">
      <a routerLink="/owner/devices">Cancel</a>
      <button type="submit" [disabled]="form.invalid || isSubmitting()">
        {{ isSubmitting() ? 'Registering...' : 'Register Device' }}
      </button>
    </div>
  </form>
</div>
