<section class="auth-split">
  <div class="auth-visual-panel">
    <app-trust-illustration caption="Give your device a history it can prove." />
  </div>

  <div class="auth-form-panel">
    <div class="auth-form-inner">
      <a routerLink="/" class="auth-brand"><img src="logo.png" alt="DeviceTrust" /></a>
      <h1>Create your account</h1>
      <p class="auth-sub">Register devices, or log repairs as a technician.</p>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <label>
          Full name
          <input type="text" formControlName="fullName" autocomplete="name" />
        </label>

        <label>
          Email
          <input type="email" formControlName="email" autocomplete="email" placeholder="you@example.com" />
        </label>

        <label>
          Password
          <input type="password" formControlName="password" autocomplete="new-password" />
        </label>
        @if (form.get('password')?.touched && form.get('password')?.invalid) {
          <p class="field-error">Use at least 8 characters.</p>
        }

        <fieldset class="role-choice">
          <legend>I'm signing up as</legend>
          <label class="role-option">
            <input type="radio" formControlName="role" value="Owner" />
            <span class="role-title">Device owner</span>
            <span class="role-desc">Register devices and track their history.</span>
          </label>
          <label class="role-option">
            <input type="radio" formControlName="role" value="Technician" />
            <span class="role-title">Technician</span>
            <span class="role-desc">Log repairs once an admin approves your repair centre.</span>
          </label>
        </fieldset>

        @if (errorMessage()) {
          <p class="form-error">{{ errorMessage() }}</p>
        }

        <button type="submit" [disabled]="form.invalid || isSubmitting()">
          {{ isSubmitting() ? 'Creating account…' : 'Create account' }}
        </button>
      </form>

      <p class="auth-switch">Already registered? <a routerLink="/login">Sign in</a></p>
    </div>
  </div>
</section>
